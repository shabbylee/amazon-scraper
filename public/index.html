<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Amazon 商品价格抓取</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #e2e8f0;
    min-height: 100vh;
  }
  .container {
    max-width: 1360px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }
  .logo {
    width: 44px; height: 44px; border-radius: 10px;
    background: linear-gradient(135deg, #ff9900, #f90);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 22px; color: #0f172a;
    letter-spacing: -1px;
  }
  h1 { margin: 0; font-size: 24px; letter-spacing: 0.2px; }
  .subtitle { color: #94a3b8; font-size: 13px; margin-top: 2px; }

  .search-bar {
    display: flex;
    gap: 10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 12px;
    backdrop-filter: blur(8px);
  }
  .search-bar input {
    flex: 1;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    color: #fff;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    transition: border-color .15s, background .15s;
  }
  .search-bar input:focus {
    border-color: #ff9900;
    background: rgba(255,153,0,0.08);
  }
  .search-bar .select-wrap {
    display: flex; align-items: center;
    background: rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 0 4px 0 12px;
    border: 1px solid rgba(255,255,255,0.08);
    font-size: 13px; color: #94a3b8;
    gap: 6px;
  }
  .search-bar select {
    background: transparent; color: #fff; border: none;
    padding: 10px 8px; font-size: 14px; cursor: pointer;
    outline: none;
  }
  .btn {
    background: linear-gradient(135deg, #ff9900, #f90);
    color: #0f172a; border: none; border-radius: 10px;
    padding: 0 26px; font-weight: 700; font-size: 14px;
    cursor: pointer; min-width: 110px;
    transition: transform .08s, box-shadow .15s;
  }
  .btn:hover {
    box-shadow: 0 8px 24px rgba(249,153,0,0.3);
    transform: translateY(-1px);
  }
  .btn:disabled {
    opacity: 0.6; cursor: not-allowed; transform: none;
  }

  .loading {
    display: none;
    align-items: center; gap: 10px;
    margin-top: 16px; color: #fbbf24; font-size: 14px;
  }
  .loading.active { display: flex; }
  .spinner {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid rgba(251,191,36,0.3);
    border-top-color: #fbbf24;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty {
    text-align: center; color: #64748b;
    padding: 80px 20px;
    background: rgba(255,255,255,0.02);
    border-radius: 14px;
    border: 1px dashed rgba(255,255,255,0.08);
  }
  .empty .hint { font-size: 13px; margin-top: 8px; }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px; margin: 24px 0 16px;
  }
  .stat-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .stat-card .label { font-size: 12px; color: #94a3b8; }
  .stat-card .value { font-size: 20px; font-weight: 700; margin-top: 4px; }
  .stat-card .value.green { color: #22c55e; }
  .stat-card .value.amber { color: #f59e0b; }
  .stat-card .value.red { color: #f87171; }

  .table-wrap {
    background: rgba(15,23,42,0.4);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    overflow: hidden;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  thead {
    background: rgba(255,255,255,0.04);
    position: sticky; top: 0; z-index: 2;
  }
  th {
    text-align: left;
    padding: 12px 14px;
    font-weight: 600;
    color: #94a3b8;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  th:hover { color: #fff; }
  th .arrow { margin-left: 4px; opacity: 0.5; }
  th.sorted .arrow { opacity: 1; color: #fbbf24; }
  td {
    padding: 10px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    vertical-align: middle;
  }
  tr:hover td { background: rgba(255,255,255,0.02); }

  .col-img { width: 72px; }
  .col-img img {
    width: 52px; height: 52px; object-fit: contain;
    border-radius: 6px;
    background: #1e293b;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .col-title { min-width: 240px; }
  .col-title a {
    color: #e2e8f0;
    text-decoration: none;
    line-height: 1.4;
  }
  .col-title a:hover { color: #fbbf24; text-decoration: underline; }
  .col-price { width: 140px; font-weight: 700; white-space: nowrap; }
  .price-num { color: #22c55e; }
  .price-na { color: #78716c; font-weight: 500; font-size: 12px; }
  .col-rating { width: 90px; }
  .rating-bar {
    display: flex; gap: 2px; align-items: center;
  }
  .star { color: #fbbf24; font-size: 14px; line-height: 1; }
  .star.empty { color: #374151; }
  .rating-num { color: #94a3b8; font-size: 12px; margin-left: 4px; }
  .col-link { width: 60px; }
  .col-link a {
    color: #ff9900; text-decoration: none;
    font-size: 12px; font-weight: 600;
  }
  .col-link a:hover { text-decoration: underline; }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    flex-wrap: wrap;
  }
  .filter-wrap { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chip {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    transition: all .12s;
  }
  .chip.active {
    background: rgba(255,153,0,0.15);
    border-color: #ff9900;
    color: #fbbf24;
  }
  .toolbar-right { display: flex; gap: 8px; }
  .mini-btn {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: #e2e8f0;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
  }
  .mini-btn:hover { border-color: #ff9900; color: #fbbf24; }

  @media (max-width: 720px) {
    .search-bar { flex-wrap: wrap; }
    h1 { font-size: 20px; }
    td, th { padding: 8px 8px; }
    .col-title { min-width: 140px; }
    .col-img img { width: 36px; height: 36px; }
  }
  /* Phase 3：详情按钮与模态框 */
  .col-detail { width: 84px; text-align: center; }
  .detail-btn {
    background: rgba(255,153,0,0.12);
    color: #ffb84d;
    border: 1px solid rgba(255,153,0,0.35);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s, opacity .15s;
  }
  .detail-btn:hover:not(:disabled) {
    background: rgba(255,153,0,0.22);
    color: #ffd08a;
    border-color: rgba(255,153,0,0.6);
  }
  .detail-btn:disabled { opacity: .5; cursor: progress; }
  .detail-btn.loading::after {
    content: '';
    display: inline-block;
    width: 8px; height: 8px;
    margin-left: 6px;
    border: 2px solid rgba(255,184,77,0.35);
    border-top-color: #ffb84d;
    border-radius: 50%;
    animation: spin .8s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(2,6,23,0.72);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center; justify-content: center;
    z-index: 100;
    padding: 24px;
  }
  .modal-backdrop.open { display: flex; }
  .modal-card {
    background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    max-width: 900px;
    width: 100%;
    max-height: calc(100vh - 48px);
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    overflow: hidden;
  }
  .modal-head {
    padding: 18px 22px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: flex-start; gap: 12px;
  }
  .modal-head .title-block { flex: 1; min-width: 0; }
  .modal-head h2 {
    margin: 0 0 4px; font-size: 17px; line-height: 1.4;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .modal-head .meta {
    font-size: 12px; color: #94a3b8;
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  .modal-head .meta code { background: rgba(255,255,255,0.06); padding: 1px 6px; border-radius: 4px; }
  .modal-close {
    background: rgba(255,255,255,0.06); color: #cbd5e1;
    border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
    width: 32px; height: 32px; font-size: 18px; cursor: pointer;
    line-height: 1; padding: 0;
    flex-shrink: 0;
  }
  .modal-close:hover { background: rgba(255,255,255,0.12); color: #fff; }
  .modal-body {
    padding: 18px 22px 22px;
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.55;
  }
  .modal-body .state {
    padding: 40px 20px; text-align: center; color: #94a3b8; font-size: 14px;
  }
  .modal-body .state.error { color: #fca5a5; }
  .modal-body .state .spinner {
    margin: 0 auto 12px;
    width: 26px; height: 26px;
    border: 3px solid rgba(255,153,0,0.2);
    border-top-color: #ff9900;
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  .detail-section { margin-bottom: 22px; }
  .detail-section:last-child { margin-bottom: 0; }
  .detail-section h3 {
    margin: 0 0 10px; font-size: 12px; letter-spacing: 0.8px;
    text-transform: uppercase; color: #94a3b8; font-weight: 700;
  }
  .breadcrumbs { color: #94a3b8; font-size: 12px; margin-bottom: 12px; }
  .breadcrumbs span + span::before { content: ' › '; margin: 0 4px; color: #475569; }
  .buybox-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px;
  }
  .buybox-cell {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .buybox-cell .k { font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
  .buybox-cell .v { font-size: 14px; color: #fff; font-weight: 600; }
  .buybox-cell .v.price { color: #ff9900; font-size: 18px; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 600;
    background: rgba(255,255,255,0.08); color: #cbd5e1;
  }
  .badge.prime { background: rgba(59,130,246,0.18); color: #93c5fd; }
  .badge.in-stock { background: rgba(34,197,94,0.18); color: #86efac; }
  .badge.out-of-stock, .badge.unavailable { background: rgba(239,68,68,0.18); color: #fca5a5; }
  .badge.pre-order, .badge.backorder { background: rgba(234,179,8,0.18); color: #fde047; }
  .hist-row {
    display: grid; grid-template-columns: 40px 1fr 44px; gap: 10px;
    align-items: center; margin-bottom: 4px; font-size: 12px;
  }
  .hist-bar {
    height: 8px; background: rgba(255,255,255,0.06);
    border-radius: 4px; overflow: hidden;
  }
  .hist-bar > div {
    height: 100%; background: linear-gradient(90deg, #ff9900, #ffb84d);
    border-radius: 4px;
  }
  .variant-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .variant-chip {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 4px 10px; font-size: 12px; color: #cbd5e1;
  }
  .variant-chip.current {
    border-color: rgba(255,153,0,0.5); color: #ffb84d;
    background: rgba(255,153,0,0.1);
  }
  .gallery { display: flex; flex-wrap: wrap; gap: 6px; }
  .gallery img {
    width: 60px; height: 60px; object-fit: contain;
    background: #fff; border-radius: 6px; padding: 3px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .bullets { padding-left: 20px; margin: 0; }
  .bullets li { margin-bottom: 4px; color: #cbd5e1; }
  .specs-table {
    width: 100%; border-collapse: collapse; font-size: 12px;
  }
  .specs-table th, .specs-table td {
    text-align: left; padding: 6px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .specs-table th {
    color: #94a3b8; font-weight: 500; width: 30%;
    background: rgba(255,255,255,0.02);
  }
  .specs-table td { color: #e2e8f0; }
  .description { color: #cbd5e1; white-space: pre-wrap; }
  .attempt-note {
    margin-top: 16px; padding: 8px 12px;
    background: rgba(255,255,255,0.03);
    border-left: 2px solid rgba(255,153,0,0.4);
    border-radius: 4px;
    font-size: 11px; color: #94a3b8;
  }

  /* Phase 4：Tab bar / badge / Watch 面板 / 图表 */
  .header-right { margin-left: auto; position: relative; }
  .badge-count {
    background: #ef4444; color: #fff;
    font-size: 11px; font-weight: 700;
    padding: 2px 7px; border-radius: 999px;
    cursor: pointer;
  }
  .tab-bar {
    display: flex; gap: 4px; margin-bottom: 20px;
    background: rgba(255,255,255,0.04);
    border-radius: 10px; padding: 4px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .tab-bar .tab {
    flex: 1; padding: 9px 16px; border: none; border-radius: 8px;
    background: transparent; color: #94a3b8;
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: background .15s, color .15s;
  }
  .tab-bar .tab:hover { color: #e2e8f0; background: rgba(255,255,255,0.04); }
  .tab-bar .tab.active { background: rgba(255,153,0,0.15); color: #ffb84d; }

  .watch-create {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 14px; padding: 18px;
  }
  .watch-form {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .watch-form input[type="text"], .watch-form select {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: #fff; padding: 9px 12px; border-radius: 8px;
    font-size: 13px; outline: none;
  }
  .watch-form input[type="text"]:focus, .watch-form select:focus {
    border-color: #ff9900;
  }
  .watch-form input#watch-keyword { flex: 2; min-width: 160px; }
  .watch-form input#watch-webhook { flex: 3; min-width: 200px; }
  .watch-form select { min-width: 150px; }
  .watch-check {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; color: #94a3b8; cursor: pointer;
  }
  .watch-check input { accent-color: #ff9900; }

  .watch-list { display: flex; flex-direction: column; gap: 8px; }
  .watch-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 10px; padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .watch-card .info { flex: 1; min-width: 0; }
  .watch-card .kw { font-weight: 600; font-size: 14px; color: #fff; }
  .watch-card .meta { font-size: 11px; color: #94a3b8; margin-top: 3px; }
  .watch-card .actions { display: flex; gap: 6px; }
  .watch-card .actions button {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    color: #cbd5e1; border-radius: 6px; padding: 5px 10px;
    font-size: 11px; cursor: pointer;
  }
  .watch-card .actions button:hover { background: rgba(255,255,255,0.12); }
  .watch-card .actions button.danger:hover { background: rgba(239,68,68,0.2); color: #fca5a5; }

  .watch-changes { display: flex; flex-direction: column; gap: 6px; }
  .change-item {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px; padding: 10px 14px;
    display: flex; align-items: center; gap: 10px; font-size: 12px;
  }
  .change-item .pct { font-weight: 700; min-width: 60px; }
  .change-item .pct.down { color: #86efac; }
  .change-item .pct.up { color: #fca5a5; }
  .change-item .name { flex: 1; color: #cbd5e1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .change-item .prices { color: #94a3b8; }
  .change-item .time { color: #64748b; font-size: 11px; min-width: 80px; text-align: right; }

  .chart-container {
    margin-top: 12px; padding: 12px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    position: relative; height: 220px;
  }
  .chart-container canvas { width: 100% !important; height: 100% !important; }
  .chart-empty { color: #64748b; font-size: 12px; text-align: center; padding: 40px 0; }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4" defer></script>
<body>
<div class="container">
  <header>
    <div class="logo">amz</div>
    <div>
      <h1>Amazon 商品价格抓取器</h1>
      <div class="subtitle">输入关键字，一键抓取商品、价格、评分，按表格展示</div>
    </div>
    <div class="header-right">
      <span class="badge-count" id="change-badge" style="display:none;" title="最近价格变化">0</span>
    </div>
  </header>

  <nav class="tab-bar" id="tab-bar">
    <button class="tab active" data-tab="search">搜索抓取</button>
    <button class="tab" data-tab="watches">Watch 管理</button>
  </nav>

  <div id="panel-search">

  <div class="search-bar">
    <input id="keyword" type="text" placeholder="输入关键字，如 laptop、gaming laptop、MacBook..." value="laptop" />
    <div class="select-wrap">
      <span>页数</span>
      <select id="pages">
        <option value="1">1 页</option>
        <option value="2">2 页</option>
        <option value="3" selected>3 页</option>
        <option value="5">5 页</option>
        <option value="10">10 页</option>
      </select>
    </div>
    <button class="btn" id="go">立即抓取</button>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <span id="loading-text">正在打开浏览器并抓取数据，请稍候...</span>
  </div>

  <div class="empty" id="empty">
    <div style="font-size:48px;opacity:.4;">🛒</div>
    <div style="font-size:16px;margin-top:8px;">输入关键字后点击「立即抓取」</div>
    <div class="hint">会在本地启动无头浏览器访问 Amazon，抓完后自动关掉，不会记录任何 Cookie 或账号信息</div>
  </div>

  <div id="results" style="display:none;">
    <div class="stats" id="stats"></div>

    <div class="table-wrap">
      <div class="toolbar">
        <div class="filter-wrap" id="filters"></div>
        <div class="toolbar-right">
          <button class="mini-btn" id="export-csv">导出 CSV</button>
        </div>
      </div>
      <table id="tbl">
        <thead>
          <tr>
            <th class="col-img">图片</th>
            <th class="col-title" data-sort="none">商品名称 <span class="arrow">↕</span></th>
            <th class="col-price" data-sort="price">价格 <span class="arrow">↕</span></th>
            <th class="col-rating" data-sort="rating">评分 <span class="arrow">↕</span></th>
            <th class="col-link">链接</th>
            <th class="col-detail">详情</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
  </div><!-- /panel-search -->

  <div id="panel-watches" style="display:none;">
    <div class="watch-create">
      <h2 style="font-size:16px;margin:0 0 12px;">创建 Watch</h2>
      <div class="watch-form">
        <input id="watch-keyword" type="text" placeholder="关键字（如 laptop）" />
        <select id="watch-cron">
          <option value="0 9 * * 1">每周一 09:00</option>
          <option value="0 9 * * *">每天 09:00</option>
          <option value="0 9 1 * *">每月 1 号 09:00</option>
          <option value="custom">自定义 cron…</option>
        </select>
        <input id="watch-cron-custom" type="text" placeholder="0 9 * * 1" style="display:none;" />
        <input id="watch-webhook" type="text" placeholder="Webhook URL（可选）" />
        <label class="watch-check"><input id="watch-notify" type="checkbox" checked /> 本地通知</label>
        <button class="btn" id="watch-create-btn" type="button">创建</button>
      </div>
    </div>
    <div class="watch-list-section">
      <h2 style="font-size:16px;margin:18px 0 10px;">我的 Watch</h2>
      <div id="watch-list" class="watch-list"></div>
    </div>
    <div class="watch-changes-section">
      <h2 style="font-size:16px;margin:18px 0 10px;">最近价格变化</h2>
      <div id="watch-changes" class="watch-changes"></div>
    </div>
  </div><!-- /panel-watches -->

</div>

<script>
const keywordEl = document.getElementById('keyword');
const pagesEl = document.getElementById('pages');
const goBtn = document.getElementById('go');
const loadingEl = document.getElementById('loading');
const loadingTextEl = document.getElementById('loading-text');
const emptyEl = document.getElementById('empty');
const resultsEl = document.getElementById('results');
const statsEl = document.getElementById('stats');
const filtersEl = document.getElementById('filters');
const tbodyEl = document.getElementById('tbody');

let rawItems = [];
let currentFilter = 'all';
let sortState = { key: 'none', dir: 1 };

function renderStats(data) {
  const pct = data.total ? Math.round((data.withPrice / data.total) * 100) : 0;
  statsEl.innerHTML = `
    <div class="stat-card">
      <div class="label">抓取商品总数</div>
      <div class="value">${data.total}</div>
    </div>
    <div class="stat-card">
      <div class="label">来源</div>
      <div class="value amber">amazon · ${data.pagesScraped} 页</div>
    </div>
    <div class="stat-card">
      <div class="label">有价格</div>
      <div class="value green">${data.withPrice}（${pct}%）</div>
    </div>
    <div class="stat-card">
      <div class="label">无价格</div>
      <div class="value red">${data.withoutPrice}</div>
    </div>
    <div class="stat-card">
      <div class="label">最低</div>
      <div class="value green">${esc(data.minPrice || '—')}</div>
    </div>
    <div class="stat-card">
      <div class="label">最高</div>
      <div class="value amber">${esc(data.maxPrice || '—')}</div>
    </div>
    <div class="stat-card">
      <div class="label">平均</div>
      <div class="value">${esc(data.avgPrice || '—')}</div>
    </div>
  `;
}

function renderFilters(data) {
  const chips = [
    { k: 'all', label: `全部 (${data.total})` },
    { k: 'price', label: `有价格 (${data.withPrice})` },
    { k: 'noprice', label: `无价格 (${data.withoutPrice})` },
  ];
  filtersEl.innerHTML = chips.map(c =>
    `<span class="chip ${c.k === currentFilter ? 'active' : ''}" data-k="${c.k}">${c.label}</span>`
  ).join('');
  filtersEl.querySelectorAll('.chip').forEach(el => {
    el.addEventListener('click', () => {
      currentFilter = el.dataset.k;
      renderFilters(data);
      renderTable();
    });
  });
}

function sortItems(items) {
  const arr = [...items];
  const { key, dir } = sortState;
  if (key === 'price') {
    arr.sort((a, b) => (a.priceNum ?? Infinity) * dir - (b.priceNum ?? Infinity) * dir);
  } else if (key === 'rating') {
    arr.sort((a, b) => ((b.rating ?? 0) - (a.rating ?? 0)) * dir);
  } else if (key === 'name') {
    arr.sort((a, b) => a.title.localeCompare(b.title, 'zh-CN') * dir);
  } else if (key === 'none') {
    arr.sort((a, b) => (a.priceNum ?? Infinity) - (b.priceNum ?? Infinity));
  }
  return arr;
}

function filterItems() {
  if (currentFilter === 'price') return rawItems.filter(x => x.hasPrice);
  if (currentFilter === 'noprice') return rawItems.filter(x => !x.hasPrice);
  return rawItems;
}

function ratingStars(v) {
  const full = Math.round(v || 0);
  let html = '';
  for (let i = 1; i <= 5; i++) {
    html += `<span class="star ${i <= full ? '' : 'empty'}">★</span>`;
  }
  html += v ? `<span class="rating-num">${v.toFixed(1)}</span>` : '';
  return html;
}

function renderTable() {
  const items = sortItems(filterItems());
  tbodyEl.innerHTML = items.map((x, i) => `
    <tr>
      <td class="col-img">
        ${x.image ? `<img src="${esc(x.image)}" alt="" loading="lazy" onerror="this.style.opacity=.4"/>` : ''}
      </td>
      <td class="col-title">
        <a href="${esc(x.href)}" target="_blank" rel="noopener" title="${esc(x.title)}">${esc(x.title) || '—'}</a>
      </td>
      <td class="col-price">
        ${x.hasPrice
          ? `<span class="price-num">${esc(x.priceText)}</span>`
          : `<span class="price-na">${esc(x.priceText)}</span>`}
      </td>
      <td class="col-rating">
        <div class="rating-bar">${ratingStars(x.rating)}</div>
      </td>
      <td class="col-link">
        <a href="${esc(x.href)}" target="_blank" rel="noopener">打开 →</a>
      </td>
      <td class="col-detail">
        <button class="detail-btn" data-asin="${esc(x.asin)}" type="button">详情</button>
      </td>
    </tr>
  `).join('');
}

// 排序：事件委托绑在 thead 上，只绑一次（修 v1.0 起 renderTable 每次重绑导致 listener 指数膨胀的 bug）
document.querySelector('#tbl thead').addEventListener('click', (e) => {
  const th = e.target.closest('th[data-sort]');
  if (!th) return;
  const k = th.dataset.sort;
  if (k === 'none') return;
  if (sortState.key === k) {
    sortState.dir *= -1;
  } else {
    sortState.key = k;
    sortState.dir = 1;
  }
  document.querySelectorAll('#tbl th').forEach(t => t.classList.remove('sorted'));
  th.classList.add('sorted');
  renderTable();
});

function exportCSV() {
  const items = filterItems();
  const rows = [['#', '商品名称', 'ASIN', '价格', '评分', '链接']];
  items.forEach((x, i) => {
    rows.push([
      i + 1,
      x.title.replace(/"/g, '""'),
      x.asin,
      x.hasPrice ? x.priceText : '没有标记价格或即将推出',
      x.rating != null ? x.rating : '',
      x.href,
    ]);
  });
  const csv = rows.map(r =>
    r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')
  ).join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `amazon-${encodeURIComponent(keywordEl.value)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}
document.getElementById('export-csv').addEventListener('click', exportCSV);

async function go() {
  const keyword = keywordEl.value.trim();
  if (!keyword) { keywordEl.focus(); return; }
  const pages = parseInt(pagesEl.value, 10);

  goBtn.disabled = true;
  emptyEl.style.display = 'none';
  resultsEl.style.display = 'none';
  loadingEl.classList.add('active');
  loadingTextEl.textContent = `正在打开浏览器并抓取 " ${keyword} "（${pages} 页），请稍候...`;

  try {
    const res = await fetch('/api/scrape', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ keyword, pages }),
    });
    if (!res.ok) throw new Error(`服务器错误：${res.status}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    rawItems = data.items || [];
    sortState = { key: 'none', dir: 1 };
    currentFilter = 'all';

    loadingEl.classList.remove('active');
    if (!rawItems.length) {
      emptyEl.style.display = 'block';
      emptyEl.innerHTML = `
        <div style="font-size:48px;opacity:.4;">😕</div>
        <div style="font-size:16px;margin-top:8px;">没抓到 "${keyword}" 的结果</div>
        <div class="hint">可能触发了 Amazon 反爬。换个关键字试试，比如 "laptop"</div>
      `;
      return;
    }

    renderStats(data);
    renderFilters(data);
    renderTable();
    resultsEl.style.display = 'block';
  } catch (err) {
    loadingEl.classList.remove('active');
    emptyEl.style.display = 'block';
    emptyEl.innerHTML = `
      <div style="font-size:48px;opacity:.4;">⚠️</div>
      <div style="font-size:16px;margin-top:8px;">抓取失败</div>
      <div class="hint">${err.message}</div>
    `;
  } finally {
    goBtn.disabled = false;
  }
}

goBtn.addEventListener('click', go);
keywordEl.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });

/* ---------- Phase 3：商品详情按需抓取 ---------- */

const modalBackdrop = document.getElementById('detail-modal');
const modalTitle = document.getElementById('detail-title');
const modalMeta = document.getElementById('detail-meta');
const modalBody = document.getElementById('detail-body');
const modalCloseBtn = document.getElementById('detail-close');

let activeDetailBtn = null;

function openModal() { modalBackdrop.classList.add('open'); }
function closeModal() {
  modalBackdrop.classList.remove('open');
  if (activeDetailBtn) {
    activeDetailBtn.classList.remove('loading');
    activeDetailBtn.disabled = false;
    activeDetailBtn = null;
  }
}
modalCloseBtn.addEventListener('click', closeModal);
modalBackdrop.addEventListener('click', (e) => { if (e.target === modalBackdrop) closeModal(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modalBackdrop.classList.contains('open')) closeModal();
});

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function renderBuyBox(bb) {
  if (!bb) return '';
  const cells = [];
  cells.push(`<div class="buybox-cell"><div class="k">Buy Box 价格</div><div class="v price">${esc(bb.priceText ?? '—')}</div></div>`);
  cells.push(`<div class="buybox-cell"><div class="k">运费 / 配送</div><div class="v" style="font-size:12px;font-weight:400;">${esc(bb.shippingText ?? '—')}</div></div>`);
  cells.push(`<div class="buybox-cell"><div class="k">卖家</div><div class="v" style="font-size:12px;font-weight:400;">${esc(bb.sellerName ?? '—')}</div></div>`);
  const badges = [];
  if (bb.isPrime) badges.push('<span class="badge prime">Prime</span>');
  badges.push(`<span class="badge ${esc(bb.availability)}">${esc(bb.availability)}</span>`);
  cells.push(`<div class="buybox-cell"><div class="k">状态</div><div class="v" style="display:flex;gap:6px;flex-wrap:wrap;">${badges.join('')}</div></div>`);
  return `<div class="detail-section"><h3>Buy Box</h3><div class="buybox-grid">${cells.join('')}</div></div>`;
}

function renderReviews(r) {
  if (!r) return '';
  const head = `
    <div style="display:flex;gap:16px;align-items:baseline;margin-bottom:10px;">
      <div style="font-size:22px;color:#ff9900;font-weight:700;">${r.averageRating != null ? r.averageRating.toFixed(1) : '—'}</div>
      <div style="color:#94a3b8;font-size:12px;">${r.totalCount != null ? r.totalCount.toLocaleString() + ' 条评论' : '暂无评论数据'}</div>
    </div>`;
  const rows = [5,4,3,2,1].map(star => {
    const pct = r.breakdown?.['star' + star];
    const width = pct != null ? Math.max(0, Math.min(100, pct)) : 0;
    return `<div class="hist-row">
      <div>${star} 星</div>
      <div class="hist-bar"><div style="width:${width}%"></div></div>
      <div style="text-align:right;color:#94a3b8;">${pct != null ? pct + '%' : '—'}</div>
    </div>`;
  }).join('');
  return `<div class="detail-section"><h3>评论统计</h3>${head}${rows}</div>`;
}

function renderVariants(variants) {
  if (!variants || !variants.length) return '';
  const chips = variants.map(v => {
    const label = v.label || v.asin;
    const dims = Object.entries(v.dimensions || {}).map(([k,val]) => `${esc(k)}: ${esc(val)}`).join(' / ');
    const title = dims ? `${esc(label)} — ${dims}` : esc(label);
    return `<span class="variant-chip ${v.isCurrent ? 'current' : ''}" title="${title}">${esc(label)}${v.isCurrent ? ' ●' : ''}</span>`;
  }).join('');
  return `<div class="detail-section"><h3>变体 (${variants.length})</h3><div class="variant-chips">${chips}</div></div>`;
}

function renderGallery(images) {
  if (!images || !images.length) return '';
  const imgs = images.slice(0, 12).map(src => `<img src="${esc(src)}" alt="" loading="lazy" onerror="this.style.opacity=.3"/>`).join('');
  return `<div class="detail-section"><h3>图片画廊 (${images.length})</h3><div class="gallery">${imgs}</div></div>`;
}

function renderBullets(bullets) {
  if (!bullets || !bullets.length) return '';
  const lis = bullets.map(b => `<li>${esc(b)}</li>`).join('');
  return `<div class="detail-section"><h3>特性</h3><ul class="bullets">${lis}</ul></div>`;
}

function renderSpecs(specs) {
  if (!specs || !specs.length) return '';
  const rows = specs.map(s => `<tr><th>${esc(s.key)}</th><td>${esc(s.value)}</td></tr>`).join('');
  return `<div class="detail-section"><h3>技术参数</h3><table class="specs-table">${rows}</table></div>`;
}

function renderDescription(desc) {
  if (!desc) return '';
  return `<div class="detail-section"><h3>描述</h3><div class="description">${esc(desc)}</div></div>`;
}

function renderBreadcrumbs(crumbs) {
  if (!crumbs || !crumbs.length) return '';
  return `<div class="breadcrumbs">${crumbs.map(c => `<span>${esc(c)}</span>`).join('')}</div>`;
}

function renderDetail(data) {
  const d = data.detail;
  const a = data.attempt || {};
  if (!d) {
    modalBody.innerHTML = `<div class="state error">
      <div style="font-size:32px;opacity:.5;margin-bottom:8px;">⚠️</div>
      <div>详情抓取失败${a.failure ? `：${esc(a.failure)}` : ''}</div>
      ${a.message ? `<div class="hint" style="margin-top:6px;color:#94a3b8;font-size:12px;">${esc(a.message)}</div>` : ''}
      ${a.retryCount ? `<div class="hint" style="margin-top:4px;color:#94a3b8;font-size:11px;">已重试 ${a.retryCount} 次（退避 ${esc((a.retryDelaysMs||[]).join(' + '))}ms）</div>` : ''}
    </div>`;
    return;
  }
  const metaParts = [
    `ASIN <code>${esc(d.asin)}</code>`,
    d.brand ? `品牌 <code>${esc(d.brand)}</code>` : '',
    `Marketplace <code>${esc(d.marketplace)}</code>`,
    data.proxyUsed ? `代理 <code>${esc(data.proxyUsed)}</code>` : '',
    a.durationMs != null ? `耗时 <code>${a.durationMs}ms</code>` : '',
    a.retryCount ? `重试 <code>${a.retryCount}</code>` : '',
  ].filter(Boolean).join(' · ');
  modalMeta.innerHTML = metaParts;
  modalBody.innerHTML = [
    renderBreadcrumbs(d.breadcrumbs),
    renderBuyBox(d.buyBox),
    renderReviews(d.reviews),
    renderVariants(d.variants),
    renderGallery(d.images),
    renderBullets(d.bullets),
    renderSpecs(d.specs),
    renderDescription(d.description),
    `<div class="detail-section"><h3>价格历史</h3><div class="chart-container" id="price-history-chart"><div class="chart-empty">加载中…</div></div></div>`,
    `<div class="attempt-note">
      抓取时间：${esc(d.capturedAt)} ·
      <a href="${esc(d.href)}" target="_blank" rel="noopener" style="color:#ffb84d;">在 Amazon 打开 →</a>
    </div>`,
  ].join('');
  // 异步加载价格历史折线图
  loadPriceHistory(d.asin);
}

async function fetchDetail(asin, btn) {
  activeDetailBtn = btn;
  btn.classList.add('loading');
  btn.disabled = true;
  modalTitle.textContent = '加载商品详情…';
  modalMeta.innerHTML = `ASIN <code>${esc(asin)}</code>`;
  modalBody.innerHTML = `<div class="state"><div class="spinner"></div><div>正在打开 Amazon 详情页并解析…</div><div class="hint" style="margin-top:8px;color:#94a3b8;font-size:12px;">首次抓取约 5-10 秒（含浏览器启动 + 反爬探测）</div></div>`;
  openModal();
  try {
    const res = await fetch('/api/detail', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ asin }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    modalTitle.textContent = data.detail?.title || `商品 ${asin}`;
    renderDetail(data);
  } catch (err) {
    modalTitle.textContent = `商品 ${asin}`;
    modalBody.innerHTML = `<div class="state error">
      <div style="font-size:32px;opacity:.5;margin-bottom:8px;">⚠️</div>
      <div>请求失败</div>
      <div class="hint" style="margin-top:6px;color:#94a3b8;font-size:12px;">${esc(err.message)}</div>
    </div>`;
  } finally {
    btn.classList.remove('loading');
    btn.disabled = false;
    activeDetailBtn = null;
  }
}

// 事件委托：一次绑定，renderTable 重绘后仍然生效
tbodyEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.detail-btn');
  if (!btn || btn.disabled) return;
  const asin = btn.dataset.asin;
  if (!asin) return;
  fetchDetail(asin, btn);
});

/* ---------- Phase 4：Tab 切换 / Watch 管理 / 价格历史图表 / Badge ---------- */

const panelSearch = document.getElementById('panel-search');
const panelWatches = document.getElementById('panel-watches');
const tabBar = document.getElementById('tab-bar');
const changeBadge = document.getElementById('change-badge');

tabBar.addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  tabBar.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  const target = tab.dataset.tab;
  panelSearch.style.display = target === 'search' ? '' : 'none';
  panelWatches.style.display = target === 'watches' ? '' : 'none';
  if (target === 'watches') { loadWatches(); loadChanges(); }
});

// Badge 点击跳到 Watch 面板
changeBadge.addEventListener('click', () => {
  tabBar.querySelector('[data-tab="watches"]').click();
});

// ─── Watch CRUD ───
const watchKeywordEl = document.getElementById('watch-keyword');
const watchCronEl = document.getElementById('watch-cron');
const watchCronCustomEl = document.getElementById('watch-cron-custom');
const watchWebhookEl = document.getElementById('watch-webhook');
const watchNotifyEl = document.getElementById('watch-notify');
const watchCreateBtn = document.getElementById('watch-create-btn');
const watchListEl = document.getElementById('watch-list');
const watchChangesEl = document.getElementById('watch-changes');

watchCronEl.addEventListener('change', () => {
  watchCronCustomEl.style.display = watchCronEl.value === 'custom' ? '' : 'none';
});

watchCreateBtn.addEventListener('click', async () => {
  const keyword = watchKeywordEl.value.trim();
  if (!keyword) { watchKeywordEl.focus(); return; }
  const cronExpr = watchCronEl.value === 'custom'
    ? (watchCronCustomEl.value.trim() || '0 9 * * 1')
    : watchCronEl.value;
  const webhookUrl = watchWebhookEl.value.trim() || null;
  const notifyLocal = watchNotifyEl.checked;

  watchCreateBtn.disabled = true;
  try {
    const res = await fetch('/api/watches', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ keyword, cronExpr, webhookUrl, notifyLocal }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    watchKeywordEl.value = '';
    watchWebhookEl.value = '';
    loadWatches();
  } catch (err) {
    alert('创建 Watch 失败：' + err.message);
  } finally {
    watchCreateBtn.disabled = false;
  }
});

async function loadWatches() {
  try {
    const res = await fetch('/api/watches');
    const data = await res.json();
    const watches = data.watches || [];
    if (!watches.length) {
      watchListEl.innerHTML = '<div style="color:#64748b;font-size:13px;padding:12px;">还没有 Watch，创建一个开始监控价格变化</div>';
      return;
    }
    watchListEl.innerHTML = watches.map(w => `
      <div class="watch-card">
        <div class="info">
          <div class="kw">${esc(w.keyword)}</div>
          <div class="meta">
            ${esc(w.cron_expr)} · ${w.pages} 页 · ${w.active ? '🟢 活跃' : '⏸ 停用'}
            ${w.last_run_at ? ' · 上次: ' + new Date(w.last_run_at).toLocaleString('zh-CN') : ' · 未执行过'}
            ${w.webhook_url ? ' · 🔗 webhook' : ''}
            ${w.notify_local ? ' · 🔔 本地通知' : ''}
          </div>
        </div>
        <div class="actions">
          <button data-action="run" data-id="${w.id}">立即执行</button>
          <button data-action="delete" data-id="${w.id}" class="danger">删除</button>
        </div>
      </div>
    `).join('');
  } catch (err) {
    watchListEl.innerHTML = `<div style="color:#fca5a5;font-size:13px;">加载失败：${esc(err.message)}</div>`;
  }
}

watchListEl.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const id = btn.dataset.id;
  const action = btn.dataset.action;
  if (action === 'delete') {
    if (!confirm('确定删除这个 Watch？关联的执行记录也会被删除。')) return;
    await fetch(`/api/watches/${id}`, { method: 'DELETE' });
    loadWatches();
  } else if (action === 'run') {
    btn.disabled = true;
    btn.textContent = '执行中…';
    try {
      // 触发一次搜索并存储（复用 /api/scrape，结果会自动入 DB）
      const watchRes = await fetch(`/api/watches/${id}`);
      const watchData = await watchRes.json();
      const w = watchData.watch;
      if (w) {
        await fetch('/api/scrape', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ keyword: w.keyword, pages: w.pages, marketplace: w.marketplace }),
        });
      }
      loadWatches();
      loadChanges();
    } catch (err) {
      alert('执行失败：' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '立即执行';
    }
  }
});

async function loadChanges() {
  try {
    const res = await fetch('/api/watches/changes/recent');
    const data = await res.json();
    const changes = data.changes || [];
    updateBadge(changes.length);
    if (!changes.length) {
      watchChangesEl.innerHTML = '<div style="color:#64748b;font-size:13px;padding:12px;">暂无价格变化记录</div>';
      return;
    }
    watchChangesEl.innerHTML = changes.slice(0, 30).map(c => {
      const pct = c.change_pct;
      const cls = pct != null ? (pct < 0 ? 'down' : 'up') : '';
      const pctText = pct != null ? `${pct > 0 ? '+' : ''}${pct}%` : '—';
      return `<div class="change-item">
        <span class="pct ${cls}">${pctText}</span>
        <span class="name" title="${esc(c.title)}">${esc(c.title)}</span>
        <span class="prices">${esc(c.old_price_text ?? '?')} → ${esc(c.new_price_text ?? '?')}</span>
        <span class="time">${new Date(c.detected_at).toLocaleDateString('zh-CN')}</span>
      </div>`;
    }).join('');
  } catch { /* 静默 */ }
}

function updateBadge(count) {
  if (count > 0) {
    changeBadge.textContent = count > 99 ? '99+' : String(count);
    changeBadge.style.display = '';
  } else {
    changeBadge.style.display = 'none';
  }
}

// 启动时加载一次 badge
loadChanges();
// 每 60 秒轮询一次
setInterval(loadChanges, 60_000);

// ─── 价格历史图表（详情模态框内） ───
let historyChart = null;

async function loadPriceHistory(asin) {
  const container = document.getElementById('price-history-chart');
  if (!container) return;
  container.innerHTML = '<div class="chart-empty">加载价格历史…</div>';
  try {
    const res = await fetch(`/api/history/${asin}?limit=200`);
    const data = await res.json();
    const snapshots = data.snapshots || [];
    if (snapshots.length < 2) {
      container.innerHTML = '<div class="chart-empty">价格历史不足（至少需要 2 次抓取才能画折线图）<br/>创建 Watch 后会周期性积累数据</div>';
      return;
    }
    container.innerHTML = '<canvas id="history-canvas"></canvas>';
    const canvas = document.getElementById('history-canvas');
    if (historyChart) { historyChart.destroy(); historyChart = null; }
    if (typeof Chart === 'undefined') {
      container.innerHTML = '<div class="chart-empty">Chart.js 未加载（离线环境？），降级为表格</div>';
      return;
    }
    historyChart = new Chart(canvas, {
      type: 'line',
      data: {
        labels: snapshots.map(s => new Date(s.captured_at).toLocaleDateString('zh-CN')),
        datasets: [{
          label: '价格',
          data: snapshots.map(s => s.price_num),
          borderColor: '#ff9900',
          backgroundColor: 'rgba(255,153,0,0.1)',
          fill: true,
          tension: 0.3,
          pointRadius: 3,
          pointBackgroundColor: '#ff9900',
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (ctx) => `${snapshots[ctx.dataIndex]?.price_text ?? ctx.parsed.y}`,
            },
          },
        },
        scales: {
          x: { ticks: { color: '#94a3b8', maxTicksLimit: 8 }, grid: { color: 'rgba(255,255,255,0.04)' } },
          y: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255,255,255,0.06)' } },
        },
      },
    });
  } catch (err) {
    container.innerHTML = `<div class="chart-empty">加载失败：${esc(err.message)}</div>`;
  }
}
</script>
