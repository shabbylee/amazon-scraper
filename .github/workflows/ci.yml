name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20/22 是 engines 下限附近的基线；24/26 覆盖更新的 V8，
        # 防止原生模块（better-sqlite3）在不被覆盖的版本上静默失配。
        node-version: [20.x, 22.x, 24.x, 26.x]
    env:
      # 测试只覆盖 parser / config / route validation，不 launch 浏览器，
      # 跳过 Puppeteer 的 Chromium 下载能把 CI 时长压掉 ~30s。
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  python-modeling:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 是 modeling/pyproject.toml 的 requires-python 下限，
        # 3.12 是本地开发与 bundled runtime 的版本，两端都守。
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: modeling
    steps:
      - uses: actions/checkout@v4

      # 由 uv 单点管理解释器版本：若另用 setup-python，uv 可能选中自己
      # 下载的解释器，使矩阵声明的版本实际没有被执行。
      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # uv.lock 是建模层依赖的唯一事实来源。--frozen 让锁文件与
      # pyproject.toml 不一致时直接失败，而不是就地重新解析。
      - name: Sync dependencies
        run: uv sync --frozen

      # 测试是纯标准库 unittest，不读 data/amazon.db，
      # 因此无需采集层产物即可在 CI 中独立运行。
      - name: Test
        run: uv run --frozen python -m unittest discover -s tests -v

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t amazon-scraper:ci .

      # docker build 只证明镜像能构建；跨阶段搬运的原生模块能否在运行时加载、
      # 容器不挂卷时能否自建 data/，都需要真跑一次才算验证。
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --rm --name scraper-smoke amazon-scraper:ci
          ok=0
          for i in $(seq 1 30); do
            sleep 2
            if docker exec scraper-smoke node -e "fetch('http://127.0.0.1:3456/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              ok=1
              echo "健康检查在第 $((i*2)) 秒通过"
              break
            fi
          done
          docker logs scraper-smoke 2>&1 | tail -25 || true
          docker stop scraper-smoke >/dev/null 2>&1 || true
          if [ "$ok" != "1" ]; then
            echo "::error::容器未在 60 秒内通过 /api/health 健康检查"
            exit 1
          fi
          echo "容器 smoke test 通过"
